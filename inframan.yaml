version: v1
application: get-api
namespace: get-api
services:
  # One service: the FastAPI backend serves the API under /api and the built
  # React frontend at / (see Dockerfile and app/server.py).
  backend:
    type: web
    path: ""
    port: 8000
    auto_domain: true
    scaling:
      type: hpa
      min_replicas: 1
      max_replicas: 2
      cpu: 70
    resources:
      cpu_request: "100m"
      memory_request: "256Mi"
      cpu_limit: "500m"
      memory_limit: "512Mi"
    build:
      method: docker
      dockerfile: ./Dockerfile
      watch_paths:
        - app
        - core
        - alembic
        - alembic.ini
        - requirements.txt
        - frontend
    env:
      DB_SCHEMA: "getapi"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      # Keep the Postgres connection count minimal: 1 pooled connection per
      # pod, up to 1 more only under load (max 2 pods -> at most 4).
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "1"
    secrets:
      SECRET_KEY: prakhratisecret
    connections:
      DATABASE_URL: postgres/rak-free-db
